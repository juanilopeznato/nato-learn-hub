<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5B21F5" />

    <!-- Hints DNS para Supabase y CDN — empieza la conexión antes de que el bundle
         haga el primer fetch. -->
    <link rel="dns-prefetch" href="https://hoolsigtquohayhpqgtb.supabase.co" />
    <link rel="preconnect" href="https://hoolsigtquohayhpqgtb.supabase.co" crossorigin />

    <!-- Theme bootstrap: lee localStorage y aplica clase .dark ANTES del primer
         paint. Evita el flash claro→oscuro. -->
    <script>
      (function () {
        try {
          // Default: light. Solo entra a dark si el user lo eligió explícito,
          // o si eligió 'system' y su OS está en dark.
          var t = localStorage.getItem('nato_theme') || 'light';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) { /* */ }
      })();
    </script>

    <!-- Anti-FOUC del color de escuela: aplica la paleta del tenant ANTES del
         primer paint, leyendo de cache (localStorage, escrito por TenantTheme) o
         de un fallback conocido. Evita el flash púrpura→oro. La raíz `/` (sin
         slug) no aplica nada → marca NATO por default. -->
    <script>
      (function () {
        try {
          var seg = location.pathname.split('/')[1];
          if (!seg) return;
          var t = null;
          try { t = JSON.parse(localStorage.getItem('nato_tenant_theme_' + seg) || 'null'); } catch (e) {}
          // Fallback para escuelas conocidas (1ra visita, sin cache aún)
          var KNOWN = { 'nata-alvarez': { primary: '#966f2c', accent: '#866027', fontHeading: "'Cormorant Garamond', Georgia, serif", fontBody: "'Montserrat', -apple-system, sans-serif" } };
          if (!t && KNOWN[seg]) t = KNOWN[seg];
          if (!t) return;
          var root = document.documentElement;
          var isDark = root.classList.contains('dark');
          function set(n, v) { root.style.setProperty(n, v); }
          function hx(hex) { var c = (hex || '').trim().replace('#', ''); if (c.length === 3) c = c.split('').map(function (x) { return x + x; }).join(''); return /^[0-9a-fA-F]{6}$/.test(c) ? c : null; }
          function hsl(hex) { var c = hx(hex); if (!c) return null; var r = parseInt(c.slice(0, 2), 16) / 255, g = parseInt(c.slice(2, 4), 16) / 255, b = parseInt(c.slice(4, 6), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0; if (mx !== mn) { var d = mx - mn; s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn); if (mx === r) h = (g - b) / d + (g < b ? 6 : 0); else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h /= 6; } return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) }; }
          function lum(hex) { var c = hx(hex); if (!c) return 0; function f(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); } return 0.2126 * f(parseInt(c.slice(0, 2), 16)) + 0.7152 * f(parseInt(c.slice(2, 4), 16)) + 0.0722 * f(parseInt(c.slice(4, 6), 16)); }
          var p = hsl(t.primary);
          if (p) {
            var pl = isDark ? Math.min(p.l + 10, 72) : p.l;
            set('--primary', p.h + ' ' + p.s + '% ' + pl + '%');
            set('--ring', p.h + ' ' + p.s + '% ' + pl + '%');
            set('--sidebar-primary', p.h + ' ' + p.s + '% ' + p.l + '%');
            set('--sidebar-ring', p.h + ' ' + p.s + '% ' + pl + '%');
            set('--primary-foreground', lum(t.primary) > 0.5 ? '222 15% 13%' : '0 0% 100%');
            if (isDark) { set('--primary-50', p.h + ' 60% 18%'); set('--primary-100', p.h + ' 70% 22%'); set('--primary-200', p.h + ' 75% 30%'); }
            else { set('--primary-50', p.h + ' 100% 97%'); set('--primary-100', p.h + ' 95% 93%'); set('--primary-200', p.h + ' 90% 86%'); }
          }
          var a = hsl(t.accent);
          if (a) { var al = isDark ? Math.min(a.l + 8, 70) : a.l; set('--accent', a.h + ' ' + a.s + '% ' + al + '%'); set('--accent-foreground', lum(t.accent) > 0.5 ? '222 47% 6%' : '0 0% 100%'); }
          if (t.fontHeading) set('--font-heading', t.fontHeading);
          if (t.fontBody) set('--font-sans', t.fontBody);
        } catch (e) { /* */ }
      })();
    </script>

    <!-- Critical CSS inline: evita FOUC mientras carga el stylesheet principal.
         Respeta light/dark via color-scheme (se setea por el script de tema arriba). -->
    <style>
      html { color-scheme: light dark; }
      html.dark { background: hsl(222 47% 6%); color: hsl(0 0% 95%); }
      html:not(.dark) { background: #ffffff; color: rgb(31, 32, 39); }
      body { margin: 0; padding: 0; font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      #root { min-height: 100vh; }
      .nato-boot { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .nato-boot::after { content: ''; width: 32px; height: 32px; border: 2px solid currentColor; border-top-color: #5B21F5; border-radius: 50%; opacity: 0.3; animation: ns 0.6s linear infinite; }
      @keyframes ns { to { transform: rotate(360deg); } }
    </style>

    <title>NATO University — Plataforma de cursos online</title>
    <meta name="description" content="Aprendé marketing digital, negocios y creación de contenido con NATO University. Cursos prácticos, certificados verificables y comunidad activa.">
    <meta name="author" content="NATO Creative" />
    <link rel="canonical" href="https://natouniversity.lovable.app/" />

    <!-- Open Graph default (los pages individuales lo sobrescriben via Helmet) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://natouniversity.lovable.app/" />
    <meta property="og:image" content="https://natouniversity.lovable.app/nato-logo.png">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="NATO University" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="NATO University — Plataforma de cursos online">
    <meta property="og:description" content="Aprendé marketing digital, negocios y creación de contenido con NATO University. Cursos prácticos, certificados verificables y comunidad activa.">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://natouniversity.lovable.app/nato-logo.png">
    <meta name="twitter:title" content="NATO University — Plataforma de cursos online">
    <meta name="twitter:description" content="Aprendé marketing digital, negocios y creación de contenido con NATO University. Cursos prácticos, certificados verificables y comunidad activa.">

    <!-- Schema.org Organization para rich snippets en Google. Las páginas específicas (CourseDetail)
         agregan Course/Review schema vía Helmet. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "NATO University",
      "url": "https://natouniversity.lovable.app",
      "logo": "https://natouniversity.lovable.app/nato-logo.png",
      "description": "Plataforma de cursos online para creadores e instructores en español. Vendé tus cursos, cobrá con Mercado Pago, certificados verificables.",
      "sameAs": [
        "https://instagram.com/nato.global",
        "https://linkedin.com/company/nato-global"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "AR"
      },
      "inLanguage": "es-AR"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NATO University",
      "url": "https://natouniversity.lovable.app",
      "inLanguage": "es-AR",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://natouniversity.lovable.app/courses?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Fuentes — preconnect + load non-blocking. Saca el @import del CSS para
         no bloquear el render del shell. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" /></noscript>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/nato-logo.png" />

    <!-- Plausible Analytics (privacy-friendly, sin cookies, sin banner de consent) -->
    <script defer data-domain="natouniversity.lovable.app" src="https://plausible.io/js/script.hash.outbound-links.tagged-events.js"></script>
    <script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>

    <!-- Sentry: se carga dinámicamente desde main.tsx solo si VITE_SENTRY_DSN está seteado -->
  </head>

  <body>
    <div id="root"><div class="nato-boot" aria-label="Cargando" role="status"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
