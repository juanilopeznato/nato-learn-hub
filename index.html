<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5B21F5" />

    <!-- Hints DNS para Supabase y CDN — empieza la conexión antes de que el bundle
         haga el primer fetch. -->
    <link rel="dns-prefetch" href="https://hoolsigtquohayhpqgtb.supabase.co" />
    <link rel="preconnect" href="https://hoolsigtquohayhpqgtb.supabase.co" crossorigin />

    <!-- Critical CSS inline: evita el flash of unstyled content mientras carga el
         stylesheet principal. Solo lo mínimo para el shell. -->
    <style>
      html, body { margin: 0; padding: 0; background: #ffffff; color: rgb(13, 13, 13); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      #root { min-height: 100vh; }
      .nato-boot { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .nato-boot::after { content: ''; width: 32px; height: 32px; border: 2px solid #e5e5e5; border-top-color: #5B21F5; border-radius: 50%; animation: ns 0.6s linear infinite; }
      @keyframes ns { to { transform: rotate(360deg); } }
    </style>

    <title>NATO University — Plataforma de cursos online</title>
    <meta name="description" content="Aprendé marketing digital, negocios y creación de contenido con NATO University. Cursos prácticos, certificados verificables y comunidad activa.">
    <meta name="author" content="NATO Creative" />
    <link rel="canonical" href="https://natouniversity.lovable.app/" />

    <!-- Open Graph default (los pages individuales lo sobrescriben via Helmet) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://natouniversity.lovable.app/" />
    <meta property="og:image" content="https://natouniversity.lovable.app/nato-logo.png">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="NATO University" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="NATO University — Plataforma de cursos online">
    <meta property="og:description" content="Aprendé marketing digital, negocios y creación de contenido con NATO University. Cursos prácticos, certificados verificables y comunidad activa.">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://natouniversity.lovable.app/nato-logo.png">
    <meta name="twitter:title" content="NATO University — Plataforma de cursos online">
    <meta name="twitter:description" content="Aprendé marketing digital, negocios y creación de contenido con NATO University. Cursos prácticos, certificados verificables y comunidad activa.">

    <!-- Fuentes — preconnect + load non-blocking. Saca el @import del CSS para
         no bloquear el render del shell. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" /></noscript>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/nato-logo.png" />

    <!-- Plausible Analytics (privacy-friendly, sin cookies, sin banner de consent) -->
    <script defer data-domain="natouniversity.lovable.app" src="https://plausible.io/js/script.hash.outbound-links.tagged-events.js"></script>
    <script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>

    <!-- Sentry: se carga dinámicamente desde main.tsx solo si VITE_SENTRY_DSN está seteado -->
  </head>

  <body>
    <div id="root"><div class="nato-boot" aria-label="Cargando" role="status"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
